yle="" class="label"><rect/><foreignObject height="69" width="220"><div xmlns="http://www.w3.org/1999/xhtml" style="display:block;white-space:nowrap;line-height:23px;width:220px;max-width:none;text-align:center;"><span class="nodeLabel"><p>Проверить функцию<br />и регистр: запись<br />либо код ошибки</p></span></div></foreignObject></g></g><g transform="translate(400, 447.5)" id="flowchart-I-7" class="node default"><polygon class="label-container" points="0,-52.5 120,0 0,52.5 -120,0"/><g transform="translate(-110, -11.5)" style="" class="label"><rect/><foreignObject height="23" width="220"><div xmlns="http://www.w3.org/1999/xhtml" style="display:block;white-space:nowrap;line-height:23px;width:220px;max-width:none;text-align:center;"><span class="nodeLabel"><p>Адрес равен 0?</p></span></div></foreignObject></g></g><g transform="translate(400, 602.5)" id="flowchart-J-11" class="node default"><rect height="85" width="240" y="-42.5" x="-120" style="" class="basic label-container"/><g transform="translate(-110, -34.5)" style="" class="label"><rect/><foreignObject height="69" width="220"><div xmlns="http://www.w3.org/1999/xhtml" style="display:block;white-space:nowrap;line-height:23px;width:220px;max-width:none;text-align:center;"><span class="nodeLabel"><p>Отправить ответ<br />или исключение<br />Счетчик ответов + 1</p></span></div></foreignObject></g></g><g transform="translate(400, 735.5)" id="flowchart-Z-15" class="node default"><rect height="85" width="240" y="-42.5" x="-120" style="" class="basic label-container"/><g transform="translate(-110, -34.5)" style="" class="label"><rect/><foreignObject height="69" width="220"><div xmlns="http://www.w3.org/1999/xhtml" style="display:block;white-space:nowrap;line-height:23px;width:220px;max-width:none;text-align:center;"><span class="nodeLabel"><p>Сброс локальных полей<br />processed = true<br />Отправить done</p></span></div></foreignObject></g></g></g></g></g></svg>