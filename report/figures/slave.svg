<svg xmlns="http://www.w3.org/2000/svg" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 800 788" height="788" class="flowchart" width="800" id="chart"><style>#chart{font-family:Times New Roman;font-size:20px;fill:#111;}#chart .error-icon{fill:#fff;}#chart .error-text{fill:#000000;stroke:#000000;}#chart .edge-thickness-normal{stroke-width:1px;}#chart .edge-thickness-thick{stroke-width:3.5px;}#chart .edge-pattern-solid{stroke-dasharray:0;}#chart .edge-thickness-invisible{stroke-width:0;fill:none;}#chart .edge-pattern-dashed{stroke-dasharray:3;}#chart .edge-pattern-dotted{stroke-dasharray:2;}#chart .marker{fill:#444;stroke:#444;}#chart .marker.cross{stroke:#444;}#chart svg{font-family:Times New Roman;font-size:20px;}#chart p{margin:0;}#chart .label{font-family:Times New Roman;color:#111;}#chart .cluster-label text{fill:#000000;}#chart .cluster-label span{color:#000000;}#chart .cluster-label span p{background-color:transparent;}#chart .label text,#chart span{fill:#111;color:#111;}#chart .node rect,#chart .node circle,#chart .node ellipse,#chart .node polygon,#chart .node path{fill:#f4f4f4;stroke:#444;stroke-width:1px;}#chart .rough-node .label text,#chart .node .label text,#chart .image-shape .label,#chart .icon-shape .label{text-anchor:middle;}#chart .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#chart .rough-node .label,#chart .node .label,#chart .image-shape .label,#chart .icon-shape .label{text-align:center;}#chart .node.clickable{cursor:pointer;}#chart .root .anchor path{fill:#444!important;stroke-width:0;stroke:#444;}#chart .arrowheadPath{fill:#0b0b0b;}#chart .edgePath .path{stroke:#444;stroke-width:2.0px;}#chart .flowchart-link{stroke:#444;fill:none;}#chart .edgeLabel{background-color:#fff;text-align:center;}#chart .edgeLabel p{background-color:#fff;}#chart .edgeLabel rect{opacity:0.5;background-color:#fff;fill:#fff;}#chart .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#chart .cluster rect{fill:#fff;stroke:hsl(0, 0%, 90%);stroke-width:1px;}#chart .cluster text{fill:#000000;}#chart .cluster span{color:#000000;}#chart div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Times New Roman;font-size:12px;background:#fff;border:1px solid hsl(0, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#chart .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#111;}#chart rect.text{fill:none;stroke-width:0;}#chart .icon-shape,#chart .image-shape{background-color:#fff;text-align:center;}#chart .icon-shape p,#chart .image-shape p{background-color:#fff;padding:2px;}#chart .icon-shape rect,#chart .image-shape rect{opacity:0.5;background-color:#fff;fill:#fff;}#chart :root{--mermaid-font-family:Times New Roman;}</style><g><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="5" viewBox="0 0 10 10" class="marker flowchart-v2" id="chart_flowchart-v2-pointEnd"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="4.5" viewBox="0 0 10 10" class="marker flowchart-v2" id="chart_flowchart-v2-pointStart"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 0 5 L 10 10 L 10 0 z"/></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="11" viewBox="0 0 10 10" class="marker flowchart-v2" id="chart_flowchart-v2-circleEnd"><circle style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" r="5" cy="5" cx="5"/></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="-1" viewBox="0 0 10 10" class="marker flowchart-v2" id="chart_flowchart-v2-circleStart"><circle style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" r="5" cy="5" cx="5"/></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5.2" refX="12" viewBox="0 0 11 11" class="marker cross flowchart-v2" id="chart_flowchart-v2-crossEnd"><path style="stroke-width: 2; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 1,1 l 9,9 M 10,1 l -9,9"/></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5.2" refX="-1" viewBox="0 0 11 11" class="marker cross flowchart-v2" id="chart_flowchart-v2-crossStart"><path style="stroke-width: 2; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 1,1 l 9,9 M 10,1 l -9,9"/></marker><g class="root"><g class="clusters"/><g class="edgePaths"><path marker-end="url(#chart_flowchart-v2-pointEnd)" style="" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" id="L_A_B_0" d="M400,95 V116"/><path style="" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" id="L_B_K_1" d="M280,172.5 H160 V665 H396"/><path marker-end="url(#chart_flowchart-v2-pointEnd)" style="" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" id="L_B_C_2" d="M400,225 V281"/><path marker-end="url(#chart_flowchart-v2-pointEnd)" style="" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" id="L_C_I_3" d="M400,370 V391"/><path style="" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" id="L_I_K_4" d="M520,447.5 H640 V665 H404"/><path marker-end="url(#chart_flowchart-v2-pointEnd)" style="" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" id="L_I_J_5" d="M400,500 V556"/><path style="" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" id="L_J_K_6" d="M400,645 V661"/><path marker-end="url(#chart_flowchart-v2-pointEnd)" style="" class="edge-t